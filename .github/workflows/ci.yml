# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow lints and tests both the Ruby app (RSpec, standardrb) and
# the browser JS in public/ (standard, vitest).
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ruby:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
    # Floating @v1 (rather than a pinned SHA) so new GitHub-hosted runner
    # images stay supported automatically -- see
    # https://github.com/ruby/setup-ruby#versioning
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1.2' # matches the Gemfile's pinned ruby version
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Lint
      run: bundle exec standardrb
    - name: Run tests
      run: bundle exec rspec

  javascript:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm install # no package-lock.json committed (Gemfile.lock isn't either), so npm ci isn't available
    - name: Lint
      run: npm run lint-js
    - name: Run tests
      run: npm run test-js
